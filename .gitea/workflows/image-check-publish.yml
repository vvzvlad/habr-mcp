name: Docker Image CI

# No `pull_request` trigger on purpose: this workflow pushes :latest, and
# watchtower on the prod host polls that tag every 2 minutes — a build off a PR
# branch would ship unreviewed code to production. PRs are covered by tests.yml,
# which runs the same test job without touching the registry.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea
# Actions — the built-in GITEA_TOKEN carries no package scope at all. The registry push
# below authenticates with the REGISTRY_TOKEN PAT instead.
permissions:
  contents: read   # checkout

# Runs on one branch are serialised so the newest commit's :latest is written last.
# Cancelling stays OFF: it would drop the older run's :<sha> image and leave holes in
# the tag history where a rollback may be needed.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    # No `env:` here: every field of `Settings` has a default, so importing
    # src.settings succeeds in a bare environment and the suite needs no secrets.
    # pytest.ini already pins testpaths/pythonpath/asyncio_mode.
    - name: Run tests
      run: pytest --tb=short -q

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    steps:
    - uses: actions/checkout@v7

    - name: Log in to the Gitea container registry
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with the `write:package` scope, stored as an ORGANISATION secret on
        # `projects` and inherited by every repo in it. The built-in GITEA_TOKEN
        # cannot be used here — it carries no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (watchtower deploys :latest); ANY other branch -> :<branch>.
      # Do NOT hardcode a fixed tag in the else branch: a manual workflow_dispatch off a
      # side branch would then silently overwrite the tag production deploys from — one
      # typo away from shipping unreviewed code.
      env:
        # Passed through the environment instead of being interpolated into the
        # script text: git allows `$`, backticks, quotes and parentheses in branch
        # names, so a branch like `feat/$(id)` would otherwise execute on the runner.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not
        # accept them in an image path — a repo like `My-Bot` would fail the
        # build with `invalid reference format`, so lowercase it here.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters: the push step goes left to right, so :latest is pushed
          # LAST. If :<sha> fails to push, :latest never moves and prod keeps the
          # previous image, which always has its immutable rollback twin.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag
          # ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}): illegal characters become `-`, a
          # leading non-word character becomes `_`, and the result is cut to 100 chars.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch literally named `latest` would otherwise produce the production
          # tag that watchtower deploys.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      env:
        # Through the environment, not interpolated into the script text: the
        # only thing standing between a branch name and command execution on the
        # runner is the `tr` filter in the step above, and this step runs after
        # `docker login` with REGISTRY_TOKEN. `$TAGS` below is intentionally
        # unquoted — the tags are a space-separated list and word splitting is
        # exactly what turns it into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull is required here: unlike GitHub's ephemeral runners, the self-hosted
        # runner has a persistent docker daemon, so a once-pulled base image would
        # sit in its cache for months and every build would inherit an unpatched
        # base layer.
        docker build --pull . --file Dockerfile $tag_args

    - name: Push Docker images
      env:
        # Same reasoning as in the build step: pass the tags through the
        # environment, and leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Remove the built images from the runner
      # Removes ONLY this run's tags; no `docker system prune` on a daemon shared with
      # other repos. The BuildKit cache and the dangling old base image left by
      # `--pull` need a periodic cleanup on the runner host. `always()` so it runs
      # even when the push fails.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the
        # environment, and leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
